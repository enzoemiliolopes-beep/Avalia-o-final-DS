{% extends 'base.html' %}

{% block content %}
    <form action="{{ url_for('main.editar', id=produto.id) }}" method="POST" enctype="multipart/form-data">
        <h3>Editar Produto #{{ produto.id }}</h3>

        <label>Nome
            <input type="text" name="nome" value="{{ produto.nome }}">
        </label>

        <label>Preço
            <input type="number" step="0.01" name="preco" value="{{ '%.2f'|format(produto.preco) }}">
        </label>

        <label>Categoria
            <select name="categoria_id">
                {% for c in categorias %}
                <option value="{{ c.id }}" {% if c.id == produto.categoria_id %}selected{% endif %}>{{ c.nome }}</option>
                {% endfor %}
            </select>
        </label>

        <div>
            <p>Foto atual:</p>
            <img src="{{ url_for('static', filename='uploads/' + produto.imagem) }}" alt="Foto atual">
        </div>

        <label>Trocar foto (opcional)
            <input type="file" name="foto" accept=".png,.jpg,.jpeg,.gif">
        </label>

        <button type="submit">Salvar alterações</button>
        <a href="{{ url_for('main.index') }}">Cancelar</a>
    </form>
{% endblock %}
